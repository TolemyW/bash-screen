id = "bash-screen"
name = "bash-screen"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Operate GUI apps on a remote Linux host over SSH, with a live preview pane"
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "-c", "cargo build --release && mkdir -p bin && rm -f bin/bash-screen && cp target/release/bash-screen bin/bash-screen"]

# Keeps the `bash-screen` command on PATH: links it into ~/.local/bin.
[[startup]]
command = ["sh", "scripts/link-cli.sh"]

[[actions]]
id = "link-cli"
title = "bash-screen: put the command on PATH"
contexts = ["workspace"]
command = ["sh", "scripts/link-cli.sh"]

# Opened automatically as a split beside the pane that first calls the CLI.
[[panes]]
id = "preview"
title = "bash-screen preview"
placement = "split"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/bash-screen\" preview"]

# Bind these to keys in herdr's config to change the preview resolution from anywhere.
[[actions]]
id = "sharper"
title = "bash-screen: sharper preview"
contexts = ["workspace"]
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/bin/bash-screen" res up']

[[actions]]
id = "coarser"
title = "bash-screen: coarser preview"
contexts = ["workspace"]
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/bin/bash-screen" res down']
