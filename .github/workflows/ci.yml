name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo test --release --workspace
      - run: sh -n scripts/install.sh && sh -n scripts/link-cli.sh && bash -n remote/setup.sh && bash -n remote/session.sh && bash -n tests/local-e2e.sh && bash -n tests/remote-setup.sh && python3 -m py_compile remote/bs_remote.py

  # The helper as it is released for Linux: one static program for each
  # processor, built as the release builds it.
  helper:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { name: x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { name: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p bash-screen-helper
      - run: echo '{"cmd":"version"}' | target/${{ matrix.target }}/release/bs-helper
      - uses: actions/upload-artifact@v4
        with:
          name: bs-helper-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/bs-helper

  # The remote side on a machine with no desktop installed: only the packages
  # docs/reference.md asks an administrator for, then everything as a plain user.
  remote-setup:
    needs: helper
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:26.04", "debian:12", "debian:13"]
        extra: [""]
        include:
          # Its keymap compiler cannot use the copy that setup unpacks.
          - image: "ubuntu:22.04"
            extra: xkb-data
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bs-helper-x86_64
          path: helper-bin
      - name: Packages an administrator provides
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             dbus at-spi2-core x11-xkb-utils curl ca-certificates ${{ matrix.extra }}
      - name: Set up and use a session as a plain user
        run: |
          useradd -m tester
          cp -r . /home/tester/src && chown -R tester /home/tester/src
          su tester -c 'cd /home/tester/src && bash tests/remote-setup.sh helper-bin/bs-helper'

  # The whole CLI, with this machine as the host: install, two sessions, stop.
  # Once with each helper.
  local-host:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        helper: [rust, python]
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --workspace
      - name: Packages an administrator provides
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             dbus at-spi2-core x11-xkb-utils python3 python3-pil
      - run: bash tests/local-e2e.sh target/release/bash-screen
        env:
          BASH_SCREEN_HELPER: ${{ matrix.helper }}
          BASH_SCREEN_HELPER_FILE: ${{ github.workspace }}/target/release/bs-helper
