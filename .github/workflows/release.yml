name: Release

# Pushing a tag such as v0.2.0 builds the binaries the plugin's install step
# downloads, and publishes them with their checksums.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { name: darwin-arm64, runner: macos-14, target: aarch64-apple-darwin }
          - { name: darwin-x86_64, runner: macos-14, target: x86_64-apple-darwin }
          - { name: linux-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the plugin version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' herdr-plugin.toml | head -1)"
          test "v$version" = "$GITHUB_REF_NAME"
          grep -q "^version = \"$version\"$" Cargo.toml
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/bash-screen bash-screen-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: bash-screen-${{ matrix.name }}
          path: bash-screen-${{ matrix.name }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum bash-screen-* > SHA256SUMS && cat SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" bash-screen-* SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
